services:
  web:
    image: nexa-paraguay:prod
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=https://dev.nexa.paragu-ai.com
      - NEXT_PUBLIC_GA4_ID=${NEXT_PUBLIC_GA4_ID:-G-XE49GLEP34}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=agent-net"
      - "traefik.http.routers.nexa-paraguay-dev.rule=Host(`dev.nexa.paragu-ai.com`)"
      - "traefik.http.routers.nexa-paraguay-dev.entrypoints=websecure"
      - "traefik.http.routers.nexa-paraguay-dev.tls=true"
      - "traefik.http.routers.nexa-paraguay-dev.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.nexa-paraguay-dev.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.nexa-dev-compress.compress=true"
      - "traefik.http.routers.nexa-paraguay-dev.middlewares=nexa-dev-compress"
    networks:
      - agent-net

networks:
  agent-net:
    external: true
